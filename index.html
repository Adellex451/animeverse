<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="An!meVerse — discover anime, characters and stories.">
<title>An!meVerse — Discover your next anime</title>
<style>
:root{--bg:#100e1c;--panel:#1b172b;--pink:#ff55a6;--purple:#a78bfa;--cyan:#65e5ee;--muted:#aaa4bd}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8f5ff;font-family:Inter,system-ui,Arial,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;color:inherit}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:17px 5%;background:#151224;border-bottom:1px solid #ffffff18;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:950;letter-spacing:-1.5px;background:linear-gradient(90deg,#ff65b3,#a78bfa,#63e9ec);color:transparent;background-clip:text}
nav{display:flex;gap:5px;flex-wrap:wrap}nav button{border:0;background:transparent;padding:9px 12px;border-radius:9px;color:#c4bfd3;font-size:13px}nav button.active,nav button:hover{background:#ffffff18;color:white}
.account,.primary{background:linear-gradient(100deg,#ed4eaa,#8759e9);border:0;border-radius:10px;padding:11px 16px;font-weight:800}
main{padding:26px 5% 50px;max-width:1300px;margin:auto}
.hero{position:relative;min-height:320px;border-radius:20px;overflow:hidden;padding:35px;display:flex;align-items:center;background:radial-gradient(ellipse at 80% 20%,#ed4a9b99,transparent 32%),radial-gradient(ellipse at 75% 95%,#6251e8,transparent 48%),linear-gradient(115deg,#27163e,#18162e 58%,#351c48)}
.hero:after{content:"✦";position:absolute;right:12%;top:20px;font-size:210px;color:#ffffff20;text-shadow:0 0 55px #ff83c1}
.heroText{position:relative;z-index:1;max-width:590px}.eyebrow{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#ff9ecb;font-weight:800}
h1{font-size:clamp(36px,6vw,62px);line-height:1.04;margin:12px 0;letter-spacing:-2px}.gradient{background:linear-gradient(90deg,#ff83bd,#b6a2ff,#74e9ee);color:transparent;background-clip:text}
p{color:#c4bfd3;line-height:1.65;font-size:14px}.secondary{background:#ffffff12;border:1px solid #ffffff28;border-radius:10px;padding:11px 16px;margin:12px 0 0 7px}
.section{margin-top:33px}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:15px}h2{font-size:21px;margin:0}.sub,.meta{font-size:12px;color:var(--muted);margin-top:5px}.link{background:none;border:0;color:#e6a0ff;font-size:12px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:var(--panel);border:1px solid #ffffff10;border-radius:14px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-4px);border-color:#c18bfa77}
.poster{height:155px;display:grid;place-items:center;text-align:center;padding:15px;font-size:24px;font-weight:900;text-shadow:0 2px 15px #0009}.cardBody{padding:12px}.cardBody h3{font-size:14px;margin:0 0 6px}.cardFoot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.rating{font-size:12px;color:#ffd778;font-weight:800}.tiny{border:0;border-radius:8px;background:#ffffff16;padding:7px 9px;font-size:11px}
.filters{display:flex;gap:9px;flex-wrap:wrap;margin:17px 0}input,select{background:#211c31;border:1px solid #ffffff25;border-radius:9px;padding:11px 13px;color:white}input{flex:1;min-width:180px}select{max-width:190px}
.rankRow{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:12px;padding:12px;margin:9px 0}.rankNo{font-size:23px;font-weight:950;color:#c39bff;width:30px}.rankArt{width:52px;height:55px;border-radius:9px;display:grid;place-items:center;font-size:22px;flex-shrink:0}.rankInfo{flex:1;min-width:0}.rankInfo strong{font-size:14px}.rankInfo small{display:block;color:var(--muted);font-size:11px;margin-top:4px}
.charCard,.feature,.newsCard{padding:15px;background:var(--panel);border-radius:14px;border:1px solid #ffffff10}.charCard{text-align:center}.avatar{width:75px;height:75px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:29px;font-weight:900;border:2px solid #ffffff55}.tag{display:inline-block;background:#ffffff12;border-radius:20px;padding:5px 9px;font-size:10px;color:#ded4f3;margin:4px 3px}
.featureGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.feature strong{display:block;margin:9px 0 4px}.feature p{font-size:12px;margin:0}
.newsImage{height:110px;display:grid;place-items:center;font-size:38px;background:linear-gradient(140deg,#42235d,#a34f98);border-radius:9px;margin-bottom:12px}
.empty{padding:35px;text-align:center;color:var(--muted);background:var(--panel);border-radius:14px;grid-column:1/-1}
footer{border-top:1px solid #ffffff16;padding:25px 5%;color:#938ca5;text-align:center;font-size:11px}
.modal{position:fixed;inset:0;background:#080610dd;z-index:10;display:none;align-items:center;justify-content:center;padding:18px}.modal.show{display:flex}.modalBox{width:min(570px,100%);max-height:85vh;overflow:auto;background:#211b32;border:1px solid #ffffff25;border-radius:17px;padding:23px;position:relative}.close{position:absolute;right:15px;top:12px;background:#ffffff16;border:0;border-radius:50%;width:32px;height:32px}.episode{display:flex;justify-content:space-between;padding:12px;background:#ffffff0b;border-radius:9px;margin-top:8px;font-size:12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#32264a;border:1px solid #a78bfa;padding:12px 18px;border-radius:20px;z-index:20;font-size:12px;display:none}
@media(max-width:760px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{padding:23px;min-height:280px}.hero:after{right:-35px;opacity:.5}header nav{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap}nav button{white-space:nowrap}.featureGrid{grid-template-columns:1fr}}
@media(max-width:390px){.cards{gap:9px}.poster{height:125px}}
</style></head>
<body>
<header><div class="logo">An!meVerse</div><nav aria-label="Main navigation">
<button class="active" data-page="home">Home</button><button data-page="discover">Discover</button><button data-page="rankings">Rankings</button><button data-page="characters">Characters</button><button data-page="news">News</button><button data-page="watchlist">My List <span id="listCount">0</span></button></nav><button class="account" id="accountBtn">Sign in ↗</button></header>
<main id="app"></main><footer>An!meVerse · Discover stories beyond imagination ✦<br><br>Fan discovery website prototype. Not affiliated with anime studios or streaming services.</footer>
<div class="modal" id="modal"><div class="modalBox" id="modalContent"></div></div><div class="toast" id="toast"></div>
<script>
const anime=[
{id:1,title:'Solo Leveling',genre:'Action',year:2024,score:9.2,episodes:25,status:'Completed',desc:'A low-ranked hunter discovers a mysterious power that lets him grow stronger beyond all limits.',color:'linear-gradient(140deg,#101b45,#4c50b8,#9a55c8)',mark:'LEVEL UP',symbol:'影'},
{id:2,title:'Demon Slayer',genre:'Fantasy',year:2019,score:9.0,episodes:63,status:'Completed',desc:'A young swordsman joins a demon-slaying organisation to protect humanity and help his sister.',color:'linear-gradient(140deg,#1a4547,#168d87,#b64d54)',mark:'DEMON SLAYER',symbol:'鬼'},
{id:3,title:'Jujutsu Kaisen',genre:'Action',year:2020,score:8.9,episodes:47,status:'Ongoing',desc:'A student enters a world of curses, dangerous battles and extraordinary sorcerers.',color:'linear-gradient(140deg,#20113d,#7041a5,#d14e84)',mark:'JUJUTSU',symbol:'呪'},
{id:4,title:'Frieren: Beyond Journey’s End',genre:'Adventure',year:2023,score:9.4,episodes:28,status:'Ongoing',desc:'An elven mage reflects on time, friendship and the meaning of the journey after a great adventure.',color:'linear-gradient(140deg,#173e49,#439eae,#a6c5b4)',mark:'FRIEREN',symbol:'✧'},
{id:5,title:'One Piece',genre:'Adventure',year:1999,score:9.1,episodes:1100,status:'Ongoing',desc:'A spirited pirate crew sails the seas in search of the legendary treasure known as One Piece.',color:'linear-gradient(140deg,#133e5c,#2487b2,#e8a451)',mark:'ONE PIECE',symbol:'☠'},
{id:6,title:'Spy x Family',genre:'Comedy',year:2022,score:8.5,episodes:37,status:'Ongoing',desc:'A spy, an assassin and a telepath form an unusual family while hiding their secrets.',color:'linear-gradient(140deg,#194b45,#3a9e80,#e7ae6a)',mark:'SPY × FAMILY',symbol:'X'},
{id:7,title:'Attack on Titan',genre:'Action',year:2013,score:9.1,episodes:89,status:'Completed',desc:'Humanity fights for survival behind enormous walls in a world full of mysteries.',color:'linear-gradient(140deg,#252c35,#687b79,#9a5b42)',mark:'ATTACK ON TITAN',symbol:'進'},
{id:8,title:'Haikyuu!!',genre:'Sports',year:2014,score:8.8,episodes:85,status:'Completed',desc:'A determined young volleyball player chases his dream of becoming a great athlete.',color:'linear-gradient(140deg,#602a20,#d36b29,#e9bb62)',mark:'HAIKYUU!!',symbol:'飛'},
{id:9,title:'My Hero Academia',genre:'Action',year:2016,score:8.4,episodes:159,status:'Completed',desc:'A boy born without powers works toward his dream of becoming a professional hero.',color:'linear-gradient(140deg,#1c4252,#4a9b9b,#9bc67c)',mark:'MY HERO',symbol:'力'},
{id:10,title:'Your Name',genre:'Romance',year:2016,score:8.8,episodes:1,status:'Movie',desc:'Two teenagers find their lives unexpectedly connected across distance and time.',color:'linear-gradient(140deg,#382d68,#9272b7,#e98c8e)',mark:'YOUR NAME',symbol:'君'},
{id:11,title:'Death Note',genre:'Mystery',year:2006,score:8.9,episodes:37,status:'Completed',desc:'A gifted student finds a supernatural notebook and faces a brilliant detective.',color:'linear-gradient(140deg,#11111d,#45415e,#9e354c)',mark:'DEATH NOTE',symbol:'夜'},
{id:12,title:'Chainsaw Man',genre:'Action',year:2022,score:8.6,episodes:12,status:'Ongoing',desc:'A young devil hunter is transformed and pulled into a dangerous new life.',color:'linear-gradient(140deg,#461d27,#bb493d,#f1a34f)',mark:'CHAINSAW MAN',symbol:'鋸'}];
const chars=[['Sung Jin-Woo','Solo Leveling','Shadow Monarch','影','#394caa','A hunter whose mysterious power allows him to level up.'],['Tanjiro Kamado','Demon Slayer','Demon Slayer','炭','#168b83','A compassionate swordsman with a strong sense of justice.'],['Gojo Satoru','Jujutsu Kaisen','Special Grade Sorcerer','悟','#7152bd','A powerful sorcerer known for his confidence and exceptional abilities.'],['Frieren','Frieren','Elven Mage','✧','#439eae','An elven mage who learns more about people and time.'],['Monkey D. Luffy','One Piece','Pirate Captain','ル','#db8a42','An adventurous pirate with an unbreakable dream.'],['Anya Forger','Spy x Family','Telepath','ア','#a45a9c','A cheerful child who can secretly read minds.']];
const news=[['🌟','Anime spotlight','Discover the stories and characters that make these series memorable.'],['🎬','Episode guide','Explore episode counts, series status and viewing information.'],['🎨','Character focus','Meet the heroes and personalities behind your favourite anime.'],['🏆','Community rankings','See which titles are leading our sample catalogue.']];
let watch=JSON.parse(localStorage.getItem('av_watch')||'[]'),favs=JSON.parse(localStorage.getItem('av_favs')||'[]'),user=localStorage.getItem('av_user')||'',page='home',genre='All',sort='score',search='';
const $=id=>document.getElementById(id),app=$('app');
function save(){localStorage.setItem('av_watch',JSON.stringify(watch));localStorage.setItem('av_favs',JSON.stringify(favs));$('listCount').textContent=watch.length}
function toast(s){let t=$('toast');t.textContent=s;t.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display='none',2100)}
function poster(a){return `<div class="poster" style="background:${a.color}">${a.mark}<br><small>${a.symbol}</small></div>`}
function card(a){return `<article class="card">${poster(a)}<div class="cardBody"><h3>${a.title}</h3><div class="meta">${a.year} · ${a.genre}</div><div class="cardFoot"><span class="rating">★ ${a.score}</span><button class="tiny" data-detail="${a.id}">Details ↗</button></div></div></article>`}
function rank(a,i){return `<div class="rankRow"><div class="rankNo">#${i+1}</div><div class="rankArt" style="background:${a.color}">${a.symbol}</div><div class="rankInfo"><strong>${a.title}</strong><small>${a.genre} · ${a.year} · ${a.episodes} episodes</small></div><span class="rating">★ ${a.score}</span><button class="tiny" data-detail="${a.id}">View</button></div>`}
function go(p){page=p;render();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));window.scrollTo({top:0,behavior:'smooth'})}
function close(){ $('modal').classList.remove('show') }
function detail(id){let a=anime.find(x=>x.id===+id);if(!a)return;$('modalContent').innerHTML=`<button class="close" id="closeModal">✕</button>${poster(a)}<div class="eyebrow" style="margin-top:16px">ANIME PROFILE</div><h2>${a.title}</h2><p>${a.desc}</p><span class="tag">${a.genre}</span><span class="tag">${a.year}</span><span class="tag">${a.status}</span><span class="tag">★ ${a.score}</span><h3 style="margin-top:22px">Episode information</h3><p>${a.episodes} ${a.episodes===1?'movie':'episodes'} · ${a.status}</p><div class="episode"><span>Release year</span><strong>${a.year}</strong></div><div class="episode"><span>Number of episodes</span><strong>${a.episodes}</strong></div><button class="primary" id="addWatch" style="margin-top:18px">${watch.includes(a.id)?'✓ In my list':'+ Add to watchlist'}</button><button class="secondary" id="addFav">${favs.includes(a.id)?'♥ Favourited':'♡ Favourite'}</button><p style="font-size:11px">Episode viewing is not hosted on this discovery website.</p>`;$('modal').classList.add('show');$('closeModal').onclick=close;$('addWatch').onclick=()=>{watch=watch.includes(a.id)?watch.filter(x=>x!==a.id):[...watch,a.id];save();detail(a.id);toast('Watchlist updated')};$('addFav').onclick=()=>{favs=favs.includes(a.id)?favs.filter(x=>x!==a.id):[...favs,a.id];save();detail(a.id);toast('Favourites updated')}}
function render(){
save();
if(page==='home')app.innerHTML=`<section class="hero"><div class="heroText"><div class="eyebrow">✦ YOUR NEXT ADVENTURE AWAITS</div><h1>ENTER THE <span class="gradient">ANIME</span> UNIVERSE.</h1><p>Discover unforgettable stories, legendary characters and your next favourite anime. All in one place.</p><button class="primary" data-go="discover">Explore anime ↗</button><button class="secondary" data-go="rankings">View rankings</button></div></section><section class="section"><div class="sectionHead"><div><h2>Trending now ✨</h2><div class="sub">Popular anime to explore</div></div><button class="link" data-go="discover">Explore all →</button></div><div class="cards">${anime.slice(0,4).map(card).join('')}</div></section><section class="section"><h2>Explore your universe</h2><div class="featureGrid" style="margin-top:15px"><div class="feature">🌸<strong>Discover anime</strong><p>Browse stories across genres.</p></div><div class="feature">⚔️<strong>Meet characters</strong><p>Explore heroes, rivals and villains.</p></div><div class="feature">⭐<strong>Build your list</strong><p>Keep track of shows you want to watch.</p></div></div></section><section class="section"><div class="sectionHead"><h2>Top rated anime 🏆</h2><button class="link" data-go="rankings">Full rankings →</button></div>${[...anime].sort((a,b)=>b.score-a.score).slice(0,3).map(rank).join('')}</section>`;
if(page==='discover'){let list=anime.filter(a=>(genre==='All'||a.genre===genre)&&a.title.toLowerCase().includes(search.toLowerCase())).sort((a,b)=>sort==='score'?b.score-a.score:sort==='year'?b.year-a.year:a.title.localeCompare(b.title));app.innerHTML=`<div class="eyebrow">THE ANIME LIBRARY</div><h1>Find your next <span class="gradient">favourite.</span></h1><p>Explore our sample collection of anime series and films.</p><div class="filters"><input id="search" placeholder="⌕ Search anime..." value="${search.replaceAll('"','&quot;')}"><select id="genre"><option>All</option>${['Action','Fantasy','Adventure','Comedy','Sports','Romance','Mystery'].map(x=>`<option ${genre===x?'selected':''}>${x}</option>`).join('')}</select><select id="sort"><option value="score" ${sort==='score'?'selected':''}>Top rated</option><option value="year" ${sort==='year'?'selected':''}>Newest</option><option value="name" ${sort==='name'?'selected':''}>A–Z</option></select></div><div class="sub">${list.length} anime found</div><div class="cards" style="margin-top:14px">${list.length?list.map(card).join(''):'<div class="empty">No anime found. Try another search or genre.</div>'}</div>`}
if(page==='rankings')app.innerHTML=`<div class="eyebrow">THE COMMUNITY CHART</div><h1>Anime <span class="gradient">rankings.</span></h1><p>Highest-rated titles in our sample catalogue.</p>${[...anime].sort((a,b)=>b.score-a.score).map(rank).join('')}`;
if(page==='characters')app.innerHTML=`<div class="eyebrow">MEET THE LEGENDS</div><h1>Anime <span class="gradient">characters.</span></h1><p>Explore the personalities behind the stories.</p><div class="cards">${chars.map(a=>`<article class="charCard"><div class="avatar" style="background:${a[4]}">${a[3]}</div><strong>${a[0]}</strong><div class="meta">${a[1]}</div><span class="tag">${a[2]}</span><p style="font-size:11px">${a[5]}</p></article>`).join('')}</div>`;
if(page==='news')app.innerHTML=`<div class="eyebrow">THE ANIME BULLETIN</div><h1>Anime <span class="gradient">news & features.</span></h1><p>Editorial highlights and guides from the An!meVerse universe.</p><div class="cards">${news.map(n=>`<article class="newsCard"><div class="newsImage">${n[0]}</div><div class="eyebrow">FEATURE</div><h3>${n[1]}</h3><p>${n[2]}</p></article>`).join('')}</div><p>These are sample editorial cards, not live news feeds.</p>`;
if(page==='watchlist'){let list=anime.filter(a=>watch.includes(a.id)),fav=anime.filter(a=>favs.includes(a.id));app.innerHTML=`<div class="eyebrow">YOUR PERSONAL COLLECTION</div><h1>My <span class="gradient">anime list.</span></h1><p>Your saved shows and favourites are stored in this browser.</p><section class="section"><h2>♥ Favourites</h2><div class="cards" style="margin-top:14px">${fav.length?fav.map(card).join(''):'<div class="empty">No favourites yet. Open an anime profile and tap Favourite.</div>'}</div></section><section class="section"><h2>＋ Watchlist</h2><div class="cards" style="margin-top:14px">${list.length?list.map(card).join(''):'<div class="empty">Your watchlist is empty. Explore anime and add a show.</div>'}</div></section>`}
}
document.addEventListener('click',e=>{let n=e.target.closest('[data-page]'),g=e.target.closest('[data-go]'),d=e.target.closest('[data-detail]');if(n)go(n.dataset.page);if(g)go(g.dataset.go);if(d)detail(d.dataset.detail);if(e.target===$('modal'))close()});
document.addEventListener('input',e=>{if(e.target.id==='search'){search=e.target.value;let p=e.target.selectionStart;render();$('search').focus();$('search').setSelectionRange(p,p)}});
document.addEventListener('change',e=>{if(e.target.id==='genre'){genre=e.target.value;render()}if(e.target.id==='sort'){sort=e.target.value;render()}});
$('accountBtn').onclick=()=>{if(user){if(confirm('Sign out of your local demo profile?')){user='';localStorage.removeItem('av_user');$('accountBtn').textContent='Sign in ↗';toast('Signed out')}}else{$('modalContent').innerHTML=`<button class="close" id="closeModal">✕</button><div class="eyebrow">WELCOME TO AN!MEVERSE</div><h2>Join your anime universe.</h2><p>Enter a display name for a local demo profile. This does not create a secure online account.</p><input id="username" placeholder="Display name" maxlength="25" style="width:100%;margin:12px 0"><button class="primary" id="join">Continue</button>`;$('modal').classList.add('show');$('closeModal').onclick=close;$('join').onclick=()=>{let n=$('username').value.trim();if(!n)return toast('Please enter a display name');user=n;localStorage.setItem('av_user',n);$('accountBtn').textContent='Hi, '+n+' ▾';close();toast('Welcome to An!meVerse!')}}};
if(user)$('accountBtn').textContent='Hi, '+user+' ▾';render();
</script></body></html>
